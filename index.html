<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dev Clicker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ---------- Палитра «редактор кода» ---------- */
:root {
  --bg: #090c12;
  --bg-2: #0d1119;
  --panel: #12161f;
  --panel-2: #171c28;
  --line: #232a3a;
  --text: #d9dfec;
  --muted: #6c7690;
  --green: #4ee6a0;
  --green-dim: rgba(78,230,160,.14);
  --violet: #a98bfa;
  --violet-dim: rgba(169,139,250,.14);
  --blue: #5fb2ff;
  --blue-dim: rgba(95,178,255,.14);
  --amber: #f7b955;
  --amber-dim: rgba(247,185,85,.14);
  --cat: var(--violet);
  --cat-dim: var(--violet-dim);
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; }
body {
  display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  height: 100dvh;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.045) 1px, transparent 0);
  background-size: 22px 22px;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

/* Категория апгрейдов красит акцентные элементы */
body[data-cat="skills"]    { --cat: var(--violet); --cat-dim: var(--violet-dim); }
body[data-cat="hardware"]  { --cat: var(--blue);   --cat-dim: var(--blue-dim); }
body[data-cat="projects"]  { --cat: var(--amber);  --cat-dim: var(--amber-dim); }

/* ---------- Шапка: ранг, баланс, доход ---------- */
header { padding: 10px 16px 12px; text-align: center; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #10141d, var(--bg)); position: relative; }
.winbar { display: flex; align-items: center; gap: 6px; padding: 2px 2px 10px; }
.winbar .dot { width: 7px; height: 7px; border-radius: 50%; opacity: .55; }
.winbar .dot.r { background: #ff5f57; }
.winbar .dot.y { background: #febc2e; }
.winbar .dot.g { background: #28c840; }
.winbar .filename { margin-left: 6px; font-size: 10.5px; color: var(--muted); letter-spacing: .02em; }

.rank { display: inline-flex; align-items: baseline; gap: 1px; font-size: 12px; color: var(--violet);
  border: 1px solid #352a55; background: #150f26; padding: 3px 10px; border-radius: 8px; }
.rank::before { content: '<'; color: #6d5aa8; }
.rank::after  { content: '/>'; color: #6d5aa8; margin-left: 1px; }

.balance { margin: 10px 0 2px; font-size: 40px; font-weight: 700; color: var(--green);
  text-shadow: 0 0 22px rgba(78,230,160,.4); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.balance small { font-size: 13px; color: var(--muted); font-weight: 500; text-shadow: none; margin-left: 2px; }
.pps { font-size: 12.5px; color: var(--blue); }
.pps::before { content: '\2192\00a0'; color: var(--muted); }

/* ---------- Экраны ---------- */
main { flex: 1; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.screen.active { display: flex; }
#screen-code { flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
#screen-shop { flex-direction: column; gap: 10px; }

/* ---------- Большая кнопка ---------- */
.tap-btn { position: relative; width: min(64vw, 260px); aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--green);
  background: radial-gradient(circle at 33% 28%, #1c2436, #0c0f17 72%); color: var(--green); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  box-shadow: 0 0 0 8px rgba(78,230,160,.05), 0 0 44px rgba(78,230,160,.3), inset 0 0 34px rgba(95,178,255,.12);
  transition: transform .08s ease, box-shadow .08s ease; }
.tap-btn.pressed { transform: scale(.93); box-shadow: 0 0 0 4px rgba(78,230,160,.1), 0 0 24px rgba(78,230,160,.5), inset 0 0 34px rgba(95,178,255,.22); }
.tap-ring { position: absolute; inset: -14px; border-radius: 50%; border: 1px solid rgba(78,230,160,.25);
  animation: ringPulse 3.2s ease-in-out infinite; pointer-events: none; }
@keyframes ringPulse { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.045); opacity: .1; } }
.tap-btn .laptop { font-size: min(22vw, 92px); line-height: 1; pointer-events: none; }
.tap-btn .tag { font-size: 18px; color: var(--violet); pointer-events: none; }
.hint { font-size: 13px; color: var(--muted); }
.hint::before { content: '// '; color: #3d4457; }
.hint b { color: var(--green); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .tap-ring { animation: none; } }

/* Улетающий текст «+1 LoC» */
.float { position: fixed; z-index: 50; pointer-events: none; font-weight: 700; font-size: 20px; color: var(--green);
  text-shadow: 0 0 10px rgba(78,230,160,.8); transform: translate(-50%, -50%); animation: floatUp .9s ease-out forwards; }
@keyframes floatUp { to { transform: translate(-50%, -140px); opacity: 0; } }

/* ---------- Апгрейды ---------- */
.seg { display: flex; gap: 6px; background: var(--panel); padding: 4px; border-radius: 12px; border: 1px solid var(--line);
  position: sticky; top: -16px; z-index: 5; }
.seg button { flex: 1; font: inherit; font-size: 13px; padding: 9px 4px; border: 0; border-radius: 9px; background: transparent;
  color: var(--muted); cursor: pointer; transition: color .15s ease, background .15s ease, box-shadow .15s ease; }
.seg button.active { background: var(--panel-2); color: var(--cat); box-shadow: inset 0 0 0 1px var(--cat); }

.card { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 12px;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--cat); border-radius: 12px;
  transition: opacity .15s ease; }
.card .ico { font-size: 22px; text-align: center; width: 46px; height: 46px; display: flex; align-items: center;
  justify-content: center; border-radius: 10px; background: var(--cat-dim); }
.card b { font-size: 14px; font-weight: 600; }
.card p { margin: 3px 0 5px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.card .gain { font-size: 11.5px; color: var(--blue); font-variant-numeric: tabular-nums; }
.card .lvl { font-size: 10.5px; color: var(--cat); margin-left: 7px; background: var(--cat-dim); padding: 1px 6px; border-radius: 6px; }
.buy { font: inherit; font-size: 13px; font-weight: 700; min-width: 84px; padding: 10px 8px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--green); background: var(--green-dim); color: var(--green); font-variant-numeric: tabular-nums;
  transition: transform .08s ease; }
.buy:active { transform: scale(.95); }
.card.locked { opacity: .58; }
.card.locked .buy { border-color: var(--line); background: var(--panel-2); color: var(--muted); }
.card.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ---------- Нижнее меню ---------- */
nav { display: flex; border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; font: inherit; font-size: 12px; padding: 10px 0 12px; border: 0; background: transparent;
  color: var(--muted); cursor: pointer; position: relative; transition: color .15s ease; }
nav button span { display: block; font-size: 22px; margin-bottom: 2px; }
nav button.active { color: var(--green); }
nav button.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 22px; height: 2px; border-radius: 2px; background: var(--green); }

/* Скроллбар апгрейдов — тонкий, в тон панели */
#screen-shop::-webkit-scrollbar { width: 4px; }
#screen-shop::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body data-cat="skills">

<header>
  <div class="winbar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="filename">career.dev</span>
  </div>
  <div class="rank" id="rank">Школьник</div>
  <div class="balance"><span id="balance">0</span> <small>LoC</small></div>
  <div class="pps"><span id="pps">0</span> код/сек</div>
</header>

<main>
  <!-- Вкладка «Кодинг» -->
  <section class="screen active" id="screen-code">
    <button class="tap-btn" id="tap" aria-label="Писать код">
      <div class="tap-ring"></div>
      <div class="laptop">💻</div>
      <div class="tag">&lt;/&gt;</div>
    </button>
    <div class="hint">Сила клика: <b id="power">+1</b> LoC</div>
  </section>

  <!-- Вкладка «Апгрейды» -->
  <section class="screen" id="screen-shop">
    <div class="seg" id="seg">
      <button data-cat="skills" class="active">Навыки</button>
      <button data-cat="hardware">Железо</button>
      <button data-cat="projects">Проекты</button>
    </div>
    <div id="cards" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>
</main>

<nav>
  <button class="active" data-tab="code"><span>⌨️</span>Кодинг</button>
  <button data-tab="shop"><span>🛠️</span>Апгрейды</button>
</nav>

<script>
/* ============================================================
   Dev Clicker — Telegram Mini App
   ============================================================ */

/* ---------- Telegram SDK ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#0d1117'); tg.setBackgroundColor('#0d1117'); } catch (e) {}
}
/** Вибрация: работает только внутри Telegram, вне его молча ничего не делает */
const haptic = {
  tap()   { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} },
  buy()   { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} },
  error() { try { tg.HapticFeedback.notificationOccurred('error'); } catch (e) {} }
};

/* ---------- Данные карт ----------
   tap — прирост силы клика за уровень, pps — прирост дохода в секунду за уровень */
const CARDS = [
  // Навыки: клик + пассивный доход
  { id: 'python', cat: 'skills', ico: '🐍', name: 'Изучить Python',   desc: 'Скрипты вместо рутины.',            base: 50,     tap: 1,  pps: 1 },
  { id: 'git',    cat: 'skills', ico: '🌿', name: 'Освоить Git',      desc: 'Ветки, коммиты и меньше паники.',   base: 250,    tap: 2,  pps: 2 },
  { id: 'react',  cat: 'skills', ico: '⚛️', name: 'Освоить React',    desc: 'Компоненты собираются сами.',       base: 1200,   tap: 5,  pps: 6 },
  { id: 'gemini', cat: 'skills', ico: '✨', name: 'Внедрить Gemini AI', desc: 'ИИ-напарник пишет код с тобой.',  base: 8000,   tap: 20, pps: 30 },
  // Железо: пассивный доход
  { id: 'monitor',  cat: 'hardware', ico: '🖥️', name: 'Второй монитор',        desc: 'Код слева, документация справа.', base: 100,   tap: 0, pps: 2 },
  { id: 'keyboard', cat: 'hardware', ico: '⌨️', name: 'Механическая клавиатура', desc: 'Каждый клик — как музыка.',     base: 500,   tap: 0, pps: 8 },
  { id: 'pc',       cat: 'hardware', ico: '🧠', name: 'Мощный ПК',             desc: 'Сборка за секунды.',              base: 2500,  tap: 0, pps: 30 },
  { id: 'cluster',  cat: 'hardware', ico: '🗄️', name: 'Серверный кластер',     desc: 'Код пишется даже ночью.',         base: 20000, tap: 0, pps: 250 },
  // Проекты: самый большой пассивный доход
  { id: 'bot',     cat: 'projects', ico: '🤖', name: 'Telegram-бот',  desc: 'Тысячи пользователей в чате.',    base: 1500,    tap: 0, pps: 40 },
  { id: 'web',     cat: 'projects', ico: '🌐', name: 'Веб-сервис',    desc: 'Подписки и стабильный трафик.',   base: 12000,   tap: 0, pps: 300 },
  { id: 'startup', cat: 'projects', ico: '🚀', name: 'ИИ-стартап',    desc: 'Инвесторы уже в переписке.',      base: 100000,  tap: 0, pps: 2500 },
  { id: 'giant',   cat: 'projects', ico: '🏢', name: 'IT-гигант',     desc: 'Твоя компания на бирже.',         base: 1000000, tap: 0, pps: 25000 }
];
const COST_GROWTH = 1.5; // +50% к цене за каждый уровень

/* Ранги по всего заработанному коду */
const RANKS = [
  [0, 'Школьник'], [1e3, 'Джуниор'], [2e4, 'Мидл'], [3e5, 'Сеньор'],
  [3e6, 'Тимлид'], [3e7, 'CTO'], [3e8, 'Владелец IT-гиганта']
];

/* ---------- Состояние и сохранение ---------- */
const SAVE_KEY = 'devclicker_v1';
let state = { balance: 0, total: 0, levels: {} };
let currentCat = 'skills';

/** Загружает прогресс из localStorage */
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s.balance === 'number') {
      state.balance = s.balance;
      state.total = s.total || s.balance;
      state.levels = s.levels || {};
    }
  } catch (e) {}
}
/** Сохраняет прогресс в localStorage */
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---------- Расчёты ---------- */
const level = id => state.levels[id] || 0;
/** Цена следующего уровня: base * 1.5^уровень */
const cost = c => Math.ceil(c.base * Math.pow(COST_GROWTH, level(c.id)));
/** Сила одного клика: 1 + бонусы навыков */
const tapPower = () => 1 + CARDS.reduce((s, c) => s + c.tap * level(c.id), 0);
/** Пассивный доход в секунду */
const passive = () => CARDS.reduce((s, c) => s + c.pps * level(c.id), 0);
/** Ранг по всего заработанному коду */
const rankName = () => RANKS.filter(r => state.total >= r[0]).pop()[1];

/** Короткая запись чисел: 1.2K, 3.4M ... */
function fmt(n) {
  n = Math.floor(n);
  const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  for (const [v, s] of units) {
    if (n >= v) return (n / v).toFixed(n / v >= 100 ? 0 : 1).replace(/\.0$/, '') + s;
  }
  return String(n);
}

/* ---------- Интерфейс ---------- */
const $ = id => document.getElementById(id);

/** Обновляет шапку и подсветку доступности карт */
function updateHUD() {
  $('balance').textContent = fmt(state.balance);
  $('pps').textContent = fmt(passive());
  $('power').textContent = '+' + fmt(tapPower());
  $('rank').textContent = rankName();
  document.querySelectorAll('.card').forEach(el => {
    const c = CARDS.find(x => x.id === el.dataset.id);
    el.classList.toggle('locked', state.balance < cost(c));
  });
}

/** Отрисовывает карты выбранной категории */
function renderCards() {
  $('cards').innerHTML = CARDS.filter(c => c.cat === currentCat).map(c => {
    const gains = [];
    if (c.tap) gains.push('+' + c.tap + ' за клик');
    if (c.pps) gains.push('+' + fmt(c.pps) + ' код/сек');
    return `<div class="card" data-id="${c.id}">
      <div class="ico">${c.ico}</div>
      <div>
        <b>${c.name}</b><span class="lvl">ур. ${level(c.id)}</span>
        <p>${c.desc}</p>
        <div class="gain">${gains.join(' · ')}</div>
      </div>
      <button class="buy">${fmt(cost(c))}</button>
    </div>`;
  }).join('');
  updateHUD();
}

/** Покупка / прокачка карты */
function buy(id) {
  const c = CARDS.find(x => x.id === id);
  const price = cost(c);
  if (state.balance < price) {
    haptic.error();
    const el = document.querySelector(`.card[data-id="${id}"]`);
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    return;
  }
  state.balance -= price;
  state.levels[id] = level(id) + 1;
  haptic.buy();
  save();
  renderCards();
}

/** Анимация «+N LoC», улетающая вверх от точки касания */
function spawnFloat(x, y, text) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

/** Клик по большой кнопке */
function onTap(e) {
  e.preventDefault();
  const gain = tapPower();
  state.balance += gain;
  state.total += gain;
  haptic.tap();
  spawnFloat(e.clientX + (Math.random() * 30 - 15), e.clientY - 20, '+' + fmt(gain) + ' LoC');
  const btn = $('tap');
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 90);
  updateHUD();
}

/* ---------- События ---------- */
$('tap').addEventListener('pointerdown', onTap);            // pointerdown — мгновенный отклик + мультитач
$('tap').addEventListener('contextmenu', e => e.preventDefault());

$('cards').addEventListener('click', e => {                 // делегирование: клик по кнопке цены
  const card = e.target.closest('.card');
  if (card && e.target.closest('.buy')) buy(card.dataset.id);
});

$('seg').addEventListener('click', e => {                   // переключение категорий
  const b = e.target.closest('button');
  if (!b) return;
  currentCat = b.dataset.cat;
  document.body.dataset.cat = currentCat;                    // красит акценты карточек под категорию
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('active', x === b));
  renderCards();
});

document.querySelector('nav').addEventListener('click', e => { // нижнее меню
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  $('screen-code').classList.toggle('active', b.dataset.tab === 'code');
  $('screen-shop').classList.toggle('active', b.dataset.tab === 'shop');
  haptic.tap();
});

/* ---------- Пассивный доход: раз в секунду ---------- */
setInterval(() => {
  const income = passive();
  if (income > 0) {
    state.balance += income;
    state.total += income;
  }
  updateHUD();
  save(); // автосохранение каждую секунду
}, 1000);

/* Сохраняем при сворачивании / закрытии Mini App */
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ---------- Старт ---------- */
load();
document.body.dataset.cat = currentCat;
renderCards();
</script>
</body>
</html>
